name: Waka Readme

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

          TIME_RANGE: all_time
          LANG_COUNT: 8

          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_TITLE: true
